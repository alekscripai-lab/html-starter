<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Неоновый градиент для обложки тетради/книги -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <!-- Золотой градиент для галочки -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>

    <!-- Мягкая объёмная тень -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Основной плавающий силуэт дневника -->
    <rect x="96" y="64" width="320" height="384" rx="44" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="12"/>

    <!-- Верхняя декоративная шапка -->
    <path d="M96 112 C96 85, 117 64, 144 64 L368 64 C395 64, 416 85, 416 112 L416 136 L96 136 Z" fill="url(#primaryGrad)"/>

    <!-- Элементы страниц/строк -->
    <rect x="152" y="184" width="160" height="18" rx="9" fill="#f8fafc" opacity="0.9"/>
    <rect x="152" y="232" width="208" height="18" rx="9" fill="#94a3b8" opacity="0.5"/>
    <rect x="152" y="280" width="120" height="18" rx="9" fill="#94a3b8" opacity="0.5"/>

    <!-- Круглая золотая иконка с галочкой -->
    <circle cx="344" cy="344" r="52" fill="url(#goldGrad)" />
    <path d="M322 344 L338 360 L368 328" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Пружинные крепления сверху -->
    <rect x="160" y="44" width="20" height="40" rx="10" fill="#f8fafc"/>
    <rect x="246" y="44" width="20" height="40" rx="10" fill="#f8fafc"/>
    <rect x="332" y="44" width="20" height="40" rx="10" fill="#f8fafc"/>
  </g>
</svg>
