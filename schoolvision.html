<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCHOOLVISION — Главная и Регистрация</title>
  
  <!-- Подключение шрифтов -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /* --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И СТИЛИ ТЕМИЗАЦИИ --- */
    :root {
      --bg-space: #050212;
      --panel-bg: rgba(255, 255, 255, 0.03);
      --panel-border: rgba(255, 255, 255, 0.08);
      --neon-cyan: #26e5ff;
      --neon-magenta: #ff2ec4;
      --neon-gold: #ffd166;
      --text-main: #ffffff;
      --text-muted: #b9aed6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1a0b36 0%, var(--bg-space) 80%), var(--bg-space);
      color: var(--text-main);
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* --- ШАПКА САЙТА (HEADER) С ГЕРБОМ --- */
    .nav {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      z-index: 10;
    }
    .logo-mark {
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .logo-mark img {
      height: 35px;
      width: auto;
      object-fit: contain;
      vertical-align: middle;
      margin-right: 10px;
    }
    .logo-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 24px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 1px;
    }

    /* --- ОСНОВНОЙ КОНТЕНТНЫЙ БЛОК --- */
    .main-layout {
      width: 100%;
      max-width: 1100px;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* --- СТИЛИЗАЦИЯ ФОРМЫ РЕГИСТРАЦИИ --- */
    .reg-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      height: fit-content;
    }

    .reg-card h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 25px;
      text-align: center;
      background: linear-gradient(90deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 15px 18px;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--neon-cyan);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 15px rgba(38, 229, 255, 0.15);
    }

    input[readonly] {
      background: rgba(255, 255, 255, 0.01);
      color: #71698a;
      border-color: rgba(255, 255, 255, 0.03);
      cursor: not-allowed;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
      border: none;
      border-radius: 14px;
      padding: 18px;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(255, 46, 196, 0.25);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.95;
      box-shadow: 0 6px 20px rgba(255, 46, 196, 0.4);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* --- ИНФОРМАЦИОННАЯ ПАНЕЛЬ (СПИСОК ЗАНЯТЫХ СТРАН) --- */
    .info-card {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .status-badge {
      display: none;
      text-align: center;
      padding: 15px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .status-badge.test-mode {
      display: block;
      background: rgba(255, 209, 102, 0.1);
      border: 1px dashed var(--neon-gold);
      color: var(--neon-gold);
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.05);
    }

    .countries-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 30px;
    }

    .countries-panel h3 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 15px;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .busy-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 5px;
    }

    /* Кастомный скроллбар для списка */
    .busy-list::-webkit-scrollbar { width: 6px; }
    .busy-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 3px; }
    .busy-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .busy-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    
    .busy-item .flag-tag {
      font-weight: 800;
      color: var(--neon-magenta);
    }

    .busy-item .song-details {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .empty-list-text {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- ШАПКА С ТВОИМ ОРИГИНАЛЬНЫМ ГЕРБОМ -->
  <header class="nav">
    <a href="#" class="logo-mark">
      <img src="logo.png" alt="Logo">
      <span class="logo-text">SCHOOLVISION</span>
    </a>
  </header>

  <!-- ГЛАВНЫЙ ДВУХКОЛОНОЧНЫЙ МАКЕТ СТРАНИЦЫ -->
  <main class="main-layout">
    
    <!-- КОЛОНКА 1: ФОРМА РЕГИСТРАЦИИ -->
    <section class="reg-card">
      <h2>Регистрация на конкурс</h2>
      
      <form id="registrationForm">
        <div class="form-group">
          <label for="regClass">Ваш класс:</label>
          <input type="text" id="regClass" required placeholder="Например, 10-B или 11-A">
        </div>

        <div class="form-group">
          <label for="regCountry">Страна Евровидения:</label>
          <select id="regCountry" required>
            <option value="" disabled selected>-- Выберите страну --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regYear">Год выступления песни:</label>
          <select id="regYear" required disabled>
            <option value="" disabled selected>-- Выберите страну выше --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regSong">Название трека (Автозаполнение):</label>
          <input type="text" id="regSong" readonly required placeholder="Заполнится автоматически">
        </div>

        <div class="form-group">
          <label for="regArtist">Исполнитель (Автозаполнение):</label>
          <input type="text" id="regArtist" readonly required placeholder="Заполнится автоматически">
        </div>

        <button type="submit" class="btn-submit">Подать официальную заявку</button>
      </form>
    </section>

    <!-- КОЛОНКА 2: ИНФОРМАЦИОННАЯ ЗОНА И ЗАНЯТЫЕ СТРАНЫ -->
    <section class="info-card">
      
      <!-- Тестовый режим уведомление -->
      <div id="testBadge" class="status-badge test-mode" style="display: none;">
        ⚙️ Включен режим тестирования платформы
      </div>

      <!-- Живой монитор занятых стран из Firebase -->
      <div class="countries-panel">
        <h3>📊 Занятые страны и треки</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4;">
          Список обновляется автоматически. Повторяться странам нельзя — выбирайте свободные локации.
        </p>
        <ul class="busy-list" id="busyCountriesList">
          <li class="empty-list-text">Загрузка данных из Firebase...</li>
        </ul>
      </div>

    </section>
  </main>

  <!-- СДК ПОДКЛЮЧЕНИЯ FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // Инициализация конфигурации проекта Firebase
    var firebaseConfig = {
      apiKey: "AIzaSyAmoYfyEXAC-mZo8BpWRFmqH914X9KYCw0",
      authDomain: "schoolvision-2027.firebaseapp.com",
      projectId: "schoolvision-2027",
      storageBucket: "schoolvision-2027.firebasestorage.app",
      messagingSenderId: "435486727960",
      appId: "1:435486727960:web:88aaf74cb09068b867486d"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    var currentMode = "live";
    var busyCountriesGlobal = [];

    // Список всех официальных стран Евровидения
    const OFFICIAL_COUNTRIES_LIST = [
      "Австралия", "Австрия", "Азербайджан", "Албания", "Андорра", "Армения", "Бельгия", 
      "Болгария", "Босния и Герцеговина", "Великобритания", "Венгрия", "Германия", "Греция", 
      "Грузия", "Дания", "Израиль", "Ирландия", "Исландия", "Испания", "Италия", "Кипр", 
      "Латвия", "Литва", "Люксембург", "Мальта", "Марокко", "Молдова", "Монако", "Нидерланды", 
      "Норвегия", "Польша", "Португалия", "Россия", "Румыния", "Сан-Марино", "Северная Македония", 
      "Сербия", "Словакия", "Словения", "Турция", "Украина", "Финляндия", "Франция", "Хорватия", 
      "Черногория", "Чехия", "Швейцария", "Швеция", "Эстония"
    ];

    const countrySelect = document.getElementById("regCountry");
    const yearSelect = document.getElementById("regYear");
    const songInput = document.getElementById("regSong");
    const artistInput = document.getElementById("regArtist");
    const testBadge = document.getElementById("testBadge");
    const busyListUI = document.getElementById("busyCountriesList");

    // 1. Динамическое отслеживание глобальных системных параметров из Firebase
    db.collection("schoolvision").doc("site:content").onSnapshot(function(snap) {
      if (snap.exists) {
        currentMode = snap.data().systemMode || "live";
        testBadge.style.display = currentMode === "test" ? "block" : "none";
        loadApplicationsRealtime(); // Перезапускаем мониторинг нужного списка
      }
    });

    // 2. Генерация списка стран при загрузке
    function buildCountryDropdown() {
      // Очищаем и сортируем
      countrySelect.innerHTML = '<option value="" disabled selected>-- Выберите страну --</option>';
      OFFICIAL_COUNTRIES_LIST.sort().forEach(country => {
        const opt = document.createElement("option");
        opt.value = country;
        opt.textContent = country;
        countrySelect.appendChild(opt);
      });
    }

    // 3. Отслеживание поданных и занятых стран в реальном времени
    function loadApplicationsRealtime() {
      const activePath = currentMode === "test" ? "applications:test_list" : "applications:list";
      
      db.collection("schoolvision").doc(activePath).onSnapshot(function(doc) {
        let items = [];
        busyCountriesGlobal = [];
        
        if (doc.exists && doc.data().items) {
          items = doc.data().items;
        }

        if (items.length === 0) {
          busyListUI.innerHTML = '<li class="empty-list-text">Все страны пока свободны. Будьте первыми!</li>';
          return;
        }

        var html = "";
        items.forEach(function(app) {
          // Сохраняем имя занятой страны (для валидации)
          busyCountriesGlobal.push(app.country.toLowerCase());
          
          // Рендерим плашку в правый монитор
          var statusText = app.status === "approved" ? "🟢 Одобрено" : "🟡 Модерация";
          html += '<li class="busy-item">' +
                    '<div>' +
                      '<span class="flag-tag">' + escapeStr(app.country) + '</span> (' + escapeStr(app.className) + ')' +
                      '<div class="song-details">' + escapeStr(app.artist) + ' — «' + escapeStr(app.song) + '» (' + app.year + ')</div>' +
                    '</div>' +
                    '<div style="font-size:11px; font-weight:700;">' + statusText + '</div>' +
                  '</li>';
        });
        busyListUI.innerHTML = html;
      });
    }

    // 4. Логика разблокировки годов при клике на страну
    countrySelect.addEventListener("change", function() {
      const selectedCountry = this.value.toLowerCase();
      
      // Проверка на уникальность перед заполнением
      if (busyCountriesGlobal.includes(selectedCountry)) {
        alert("Внимание! Эта страна уже занята другой командой. Выберите свободный регион.");
        this.value = "";
        yearSelect.disabled = true;
        return;
      }

      yearSelect.innerHTML = '<option value="" disabled selected>-- Выберите год --</option>';
      yearSelect.disabled = false;
      songInput.value = "";
      artistInput.value = "";
      songInput.placeholder = "Поиск официального трека...";
      artistInput.placeholder = "Поиск артиста...";
      songInput.readOnly = true;
      artistInput.readOnly = true;

      // Генерируем таймлайн Евровидения
      for (let y = 2026; y >= 1956; y--) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
      }
    });

    // 5. Обращение к внешнему музыкальному API iTunes/Genius для автозаполнения
    yearSelect.addEventListener("change", function() {
      const country = countrySelect.value;
      const year = this.value;
      const query = encodeURIComponent(`Eurovision ${year} ${country}`);
      
      fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`)
        .then(res => res.json())
        .then(data => {
          if (data.results && data.results.length > 0) {
            const track = data.results[0];
            // Чистим мусорные приписки в названии сингла
            let cleanSong = track.trackName.replace(/\s*\(.*?Eurovision.*?\)\s*/gi, '');
            songInput.value = cleanSong;
            artistInput.value = track.artistName;
            songInput.readOnly = true;
            artistInput.readOnly = true;
          } else {
            // Если трека нет в API — даем вбить руками
            songInput.value = "";
            artistInput.value = "";
            songInput.placeholder = "Не найдено автоматически. Введите вручную...";
            artistInput.placeholder = "Введите автора вручную...";
            songInput.readOnly = false;
            artistInput.readOnly = false;
          }
        })
        .catch(() => {
          songInput.placeholder = "Ошибка соединения. Введите руками...";
          songInput.readOnly = false;
          artistInput.readOnly = false;
        });
    });

    // 6. Обработка отправки формы
    document.getElementById("registrationForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const chosenCountry = countrySelect.value;
      if (busyCountriesGlobal.includes(chosenCountry.toLowerCase())) {
        alert("Ошибка! Эта страна была занята кем-то прямо перед вами.");
        return;
      }

      const newApplication = {
        id: "app_" + Date.now(),
        className: document.getElementById("regClass").value,
        country: chosenCountry,
        year: yearSelect.value,
        song: songInput.value,
        artist: artistInput.value,
        status: "pending",
        timestamp: new Date().toISOString()
      };

      const dbTarget = currentMode === "test" ? "applications:test_list" : "applications:list";

      db.collection("schoolvision").doc(dbTarget).get().then(doc => {
        let items = [];
        if (doc.exists && doc.data().items) {
          items = doc.data().items;
        }
        items.push(newApplication);
        return db.collection("schoolvision").doc(dbTarget).set({ items: items });
      }).then(() => {
        alert(currentMode === "test" ? "Тест пройден! Запись упала в тестовый реестр." : "Заявка успешно принята и отправлена на модерацию!");
        document.getElementById("registrationForm").reset();
        yearSelect.disabled = true;
        songInput.readOnly = true;
        artistInput.readOnly = true;
      }).catch(err => {
        alert("Критическая ошибка отправки в базу: " + err.message);
      });
    });

    function escapeStr(str) {
      if (!str) return "";
      return String(str).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;");
    }

    // Старт сборки интерфейса
    buildCountryDropdown();
  </script>
</body>
</html>
